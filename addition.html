<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            function addition(a, b) {
                return a + b;
            }
        </script>
    </head>
    <body>
        <h2>Welcome to JavaScript Functions</h2>
        <button onclick="console.log"("The sum of 5 and 10 is: " + add(5,10))>Click Me</button>
    </body>
</html>
