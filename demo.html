<!DOCTYPE html>
<html>
<head>
    <title>Passing Function to Another Function</title>
</head>

<body>

    <h1>Passing One Function to Another Function</h1>

    <button onclick="executeFunction(greet)">
        Execute Function
    </button>

    <p id="output"></p>

    <script>

        // Function to be passed
        function greet() {

            console.log("Hello, Welcome to JavaScript!");

            document.getElementById("output").innerHTML =
                "Hello, Welcome to JavaScript!";
        }


        // Function that accepts another function
        function executeFunction(fn) {

            console.log("Executing the passed function...");

            document.getElementById("output").innerHTML =
                "Executing the passed function...<br>";

            // Calling the passed function
            fn();
        }


        // Passing greet function to executeFunction
        // executeFunction(greet);

    </script>

</body>
</html>
